name: Sync FFHANDBALL Matches

on:
  schedule:
    # Quotidien a 7h00 (UTC+1, donc 6h UTC)
    - cron: '0 6 * * *'
    # Vendredi a 18h00 (UTC+1, donc 17h UTC)
    - cron: '0 17 * * 5'
    # Samedi a 22h30 (UTC+1) : resultats de la journee
    - cron: '30 21 * * 6'
    # Dimanche a 20h00 (UTC+1, donc 19h UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch: # Permet de lancer manuellement

concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun ci

      # Les donnees sont lues directement dans les pages FFHandball : aucun navigateur requis.
      - name: Run sync
        run: bun run sync:matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
