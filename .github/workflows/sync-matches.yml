name: Sync FFHANDBALL Matches

on:
  schedule:
    # Quotidien a 7h00 (UTC+1, donc 6h UTC)
    - cron: '0 6 * * *'
    # Vendredi a 18h00 (UTC+1, donc 17h UTC)
    - cron: '0 17 * * 5'
    # Dimanche a 20h00 (UTC+1, donc 19h UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Playwright is supported on Node; Bun remains the package manager and task runner.
      - name: Setup Node for Playwright
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Bun and Playwright caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Run sync
        run: bun run sync:matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
